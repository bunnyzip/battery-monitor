<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battery Monitor — Live</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
    min-height: 100vh; color: #fff; padding: 20px;
  }
  .header { text-align: center; margin-bottom: 20px; }
  .header h1 { font-size: 1.6em; letter-spacing: 1px; }
  .status-line { margin-top: 6px; font-size: 0.85em; opacity: 0.85; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .dot.ok { background: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
  .dot.stale { background: #e74c3c; box-shadow: 0 0 8px #e74c3c; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 900px; margin: 0 auto; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: #fff; color: #123; border-radius: 16px; padding: 18px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .card h2 { font-size: 1.05em; color: #16324f; display: flex; justify-content: space-between; align-items: center; }
  .bignum { font-size: 2.4em; font-weight: 700; color: #0b2545; margin: 8px 0 2px; }
  .bignum small { font-size: 0.4em; color: #5a7184; font-weight: 600; }
  .socbar { background: #e8edf2; border-radius: 10px; height: 22px; overflow: hidden; margin: 8px 0 12px; }
  .socfill { height: 100%; background: linear-gradient(90deg, #2ecc71, #27ae60); color: #fff;
             font-size: 0.75em; font-weight: 700; text-align: right; padding-right: 8px; line-height: 22px; transition: width .6s; }
  .cells { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
  .cell { background: #eef3f8; border-radius: 8px; text-align: center; padding: 6px 2px; }
  .cell .v { font-weight: 700; color: #0b2545; font-size: 0.95em; }
  .cell .l { font-size: 0.65em; color: #5a7184; }
  .stats { display: flex; justify-content: space-between; font-size: 0.82em; color: #34495e; border-top: 1px solid #e3e9ef; padding-top: 8px; }
  .stats b { color: #0b2545; }
  canvas { width: 100%; height: 60px; margin-top: 10px; }
  .panel { background: #fff; color: #123; border-radius: 16px; padding: 18px;
           box-shadow: 0 8px 24px rgba(0,0,0,0.35); max-width: 900px; margin: 16px auto 0; }
  .panel h3 { color: #1a5dad; font-size: 1.05em; border-bottom: 2px solid #1a5dad; display: inline-block; padding-bottom: 2px; margin-bottom: 10px; }
  .pills { display: flex; gap: 10px; flex-wrap: wrap; }
  .pill { border: 2px solid #3498db; border-radius: 10px; padding: 6px 14px; color: #16324f; font-size: .9em; }
  .pill b.ok { color: #27ae60; } .pill b.bad { color: #e74c3c; } .pill b { color: #1a5dad; }
  table { width: 100%; border-collapse: collapse; font-size: .88em; }
  th { background: #1a5dad; color: #fff; text-align: left; padding: 7px 10px; }
  td { padding: 6px 10px; border-bottom: 1px solid #e3e9ef; color: #16324f; }
  tr:nth-child(even) td { background: #f2f7fc; }
  .footer { text-align: center; font-size: 0.75em; opacity: 0.7; margin-top: 18px; }
  .footer a { color: #9ad3ff; }
</style>
</head>
<body>
  <div class="header">
    <h1>🔋 Battery Monitor — Live</h1>
    <div class="status-line" id="status"><span class="dot stale"></span>connecting…</div>
  </div>
  <div class="grid" id="grid"></div>

  <div class="panel">
    <h3>🩺 System health</h3>
    <div class="pills" id="health"></div>
  </div>

  <div class="panel">
    <h3>📅 Daily summary</h3>
    <table><thead><tr><th>Day</th><th>Battery</th><th>SOC range</th><th>Avg SOC</th><th>Records</th></tr></thead>
    <tbody id="daily"></tbody></table>
  </div>

  <div class="panel">
    <h3>📌 Recent events</h3>
    <table><thead><tr><th>Time</th><th style="width:60%">Event</th></tr></thead>
    <tbody id="events"></tbody></table>
  </div>

  <div class="footer">
    Data straight from the ESP32 board → Firebase · auto-refresh 30s · no server needed<br>
    <a href="https://github.com/bunnyzip/battery-monitor">project repo</a>
  </div>

<script>
const BASE = "https://battery-monitor-a1063-default-rtdb.asia-southeast1.firebasedatabase.app";
const BATTS = [1, 2];

function f(v, d = 2) { return (v === null || v === undefined || isNaN(v)) ? "—" : Number(v).toFixed(d); }

function ago(ts) {
  const s = Math.floor(Date.now() / 1000) - ts;
  if (s < 90) return s + "s ago";
  if (s < 5400) return Math.floor(s / 60) + "m ago";
  return Math.floor(s / 3600) + "h ago";
}

function state(d) {
  const a = Number(d.a);
  if (isNaN(a) || Math.abs(a) < 0.5) return { t: "Idle", e: "⏸", c: "#7f8c8d", bg: "#eef1f4" };
  return a > 0 ? { t: "Charging", e: "⚡", c: "#27ae60", bg: "#e8f8ef" }
               : { t: "Discharging", e: "🔻", c: "#e67e22", bg: "#fdf0e3" };
}

function card(n, d, hist) {
  const fresh = d && d.ts && (Date.now() / 1000 - d.ts < 180);
  const soc = d && d.soc !== undefined ? d.soc : 0;
  const color = soc > 50 ? "#2ecc71" : soc > 20 ? "#f39c12" : "#e74c3c";
  const st = state(d || {});
  let cells = "";
  for (let i = 1; i <= 4; i++) {
    cells += `<div class="cell"><div class="v">${f(d["c" + i], 3)}</div><div class="l">Cell ${i}</div></div>`;
  }
  let spark = "";
  if (hist && hist.length > 2) {
    spark = `<canvas id="spark${n}" width="400" height="60"></canvas>`;
  }
  return `<div class="card">
    <h2><span>🔋 Battery ${n}</span><span style="font-size:.75em;color:${fresh ? "#27ae60" : "#c0392b"}">${d && d.ts ? ago(d.ts) : "no data"}</span></h2>
    <div style="display:inline-block;margin-top:6px;padding:3px 12px;border-radius:20px;background:${st.bg};color:${st.c};font-weight:700;font-size:.85em">${st.e} ${st.t}</div>
    <div class="bignum">${f(d.v)} <small>V</small></div>
    <div class="socbar"><div class="socfill" style="width:${soc}%;background:linear-gradient(90deg,${color},${color}aa)">${soc}%</div></div>
    <div class="cells">${cells}</div>
    <div class="stats">
      <span>⚡ <b>${f(d.a)} A</b></span>
      <span>🌡 <b>${f(d.t, 1)}°C</b></span>
      <span>🔁 <b>${d.cycles ?? "—"} cycles</b></span>
    </div>
    ${spark}
  </div>`;
}

function drawSpark(n, hist) {
  const c = document.getElementById("spark" + n);
  if (!c || !hist || hist.length < 2) return;
  const ctx = c.getContext("2d");
  const vs = hist.map(h => h.v).filter(v => !isNaN(v));
  if (vs.length < 2) return;
  const min = Math.min(...vs), max = Math.max(...vs), pad = (max - min) || 0.1;
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.strokeStyle = "#27ae60"; ctx.lineWidth = 3; ctx.beginPath();
  vs.forEach((v, i) => {
    const x = i / (vs.length - 1) * c.width;
    const y = c.height - 8 - (v - min + pad * 0.2) / (pad * 1.4) * (c.height - 16);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.stroke();
}

function fmtTime(ts) {
  const d = new Date(ts * 1000);
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + ", " +
         d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}
function dayKey(ts) { return new Date(ts * 1000).toLocaleDateString(undefined, { month: "short", day: "numeric" }); }

function renderHealth(datas) {
  const el = document.getElementById("health");
  const anyFresh = datas.some(d => d && d.ts && Date.now() / 1000 - d.ts < 300);
  let lastTs = 0;
  datas.forEach(d => { if (d && d.ts) lastTs = Math.max(lastTs, d.ts); });
  el.innerHTML =
    `<div class="pill">🔌 Board: <b class="${anyFresh ? "ok" : "bad"}">${anyFresh ? "online" : "offline"}</b></div>` +
    `<div class="pill">Last update: <b class="${anyFresh ? "ok" : "bad"}">${lastTs ? ago(lastTs) : "—"}</b></div>` +
    `<div class="pill">History records: <b>${datas.reduce((s, d) => s + (d && d.count ? d.count : 0), 0)}</b></div>`;
}

function renderDaily(hist) {
  const rows = {};
  BATTS.forEach((n, i) => {
    (hist[i] || []).forEach(h => {
      if (h.soc === undefined || !h.ts) return;
      const k = dayKey(h.ts);
      const key = k + "|" + n;
      if (!rows[key]) rows[key] = { day: k, b: n, min: h.soc, max: h.soc, sum: 0, cnt: 0 };
      const r = rows[key];
      r.min = Math.min(r.min, h.soc); r.max = Math.max(r.max, h.soc);
      r.sum += h.soc; r.cnt++;
    });
  });
  const list = Object.values(rows).sort((a, b) => b.day.localeCompare(a.day) || a.b - b.b);
  document.getElementById("daily").innerHTML = list.length
    ? list.map(r => `<tr><td>${r.day}</td><td>Battery ${r.b}</td><td>${r.max}% — ${r.min}%</td><td>${Math.round(r.sum / r.cnt)}%</td><td>${r.cnt}</td></tr>`).join("")
    : `<tr><td colspan="5">no history yet</td></tr>`;
}

function renderEvents(hist) {
  const evs = [];
  BATTS.forEach((n, i) => {
    const hs = (hist[i] || []).slice().sort((a, b) => a.ts - b.ts).filter(h => h.ts);
    let prev = null;
    hs.forEach(h => {
      if (prev) {
        if (h.ts - prev.ts > 1800) {
          evs.push({ ts: prev.ts, e: `battery ${n} offline — no data` });
          evs.push({ ts: h.ts, e: `battery ${n} back online` });
        }
        const was = prev.a > 0.5, now = h.a > 0.5;
        if (!was && now) evs.push({ ts: h.ts, e: `battery ${n} started charging` });
        if (was && !now) evs.push({ ts: h.ts, e: `battery ${n} stopped charging` });
      }
      prev = h;
    });
  });
  evs.sort((a, b) => b.ts - a.ts);
  document.getElementById("events").innerHTML = evs.length
    ? evs.slice(0, 12).map(e => `<tr><td>${fmtTime(e.ts)}</td><td>${e.e}</td></tr>`).join("")
    : `<tr><td colspan="2">no events yet</td></tr>`;
}

async function pull() {
  const st = document.getElementById("status");
  try {
    for (const n of BATTS) {
      const [d, h] = await Promise.all([
        fetch(`${BASE}/batteries/${n}.json`).then(r => r.json()),
        fetch(`${BASE}/history/${n}.json?orderBy="$key"&limitToLast=500`).then(r => r.json())
      ]);
      const hist = h ? Object.keys(h).sort().map(k => h[k]) : null;
      if (hist) d.count = hist.length;
      document.getElementById("b" + n).outerHTML = `<div id="b${n}">${card(n, d, hist)}</div>`;
      drawSpark(n, hist);
      window["_hist" + n] = hist;
      window["_live" + n] = d;
    }
    renderHealth(BATTS.map(n => window["_live" + n]));
    renderDaily(BATTS.map(n => window["_hist" + n]));
    renderEvents(BATTS.map(n => window["_hist" + n]));
    st.innerHTML = `<span class="dot ok"></span>live · updated ${new Date().toLocaleTimeString()}`;
  } catch (e) {
    st.innerHTML = `<span class="dot stale"></span>connection problem — retrying…`;
  }
}

document.getElementById("grid").innerHTML =
  BATTS.map(n => `<div id="b${n}">${card(n, {}, null)}</div>`).join("");
pull();
setInterval(pull, 30000);
</script>
</body>
</html>
